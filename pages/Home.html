<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Teaching Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body, html {
height: 100%;
width: 100%;
overflow: hidden;
background-color: #0d1335;
}

.container {
display: flex;
direction: ltr;
width: 100vw;
height: 100vh;
position: relative;
    }


.left-section {
flex: 1.1;
background: url('/static/images/education.jpg') no-repeat center center/cover;
position: relative;
z-index: 1;
}

.right-section {
flex: 0.9;
direction: rtl;
background: #f4f7ff;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px;
position: relative;
z-index: 2;
}



.form-container {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
.avatar-circle {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 2px dashed #a0c4ff;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 35px;
        background-color: #eef4ff;
    }

.avatar-circle i {
        font-size: 45px;
        color: #5382ff;
    }
.input-group {
        position: relative;
        width: 100%;
        margin-bottom: 18px;
    }

.input-group i {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #4a72e8;
        font-size: 16px;
    }

.input-group input {
        width: 100%;
        padding: 14px 48px 14px 20px;
        border: 1px solid #dbe5fc;
        border-radius: 25px;
        background-color: #ffffff;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

.input-group input:focus {
        border-color: #4a72e8;
        box-shadow: 0 0 8px rgba(74, 114, 232, 0.2);
    }

.btn-submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(90deg, #4d73ff, #6b46ff);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        box-shadow: 0 4px 12px rgba(77, 115, 255, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
.btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(77, 115, 255, 0.4);
    }
.login-link-container {
        margin-top: 20px;
        font-size: 14px;
        color: #555;
        text-align: center;
    }

    .login-link-container a {
        color: #4a72e8;
        text-decoration: none;
        font-weight: bold;
        margin-right: 5px;
        transition: color 0.2s ease;
    }

    .login-link-container a:hover {
        color: #3557bd;
        text-decoration: underline;
    }

    @media (max-width: 850px) {
        body, html {
            overflow: auto !important;
            height: auto;
        }
        .container {
            flex-direction: column;
            height: auto;
            min-height: 100vh;
        }
        .left-section {
            display: none;
        }
        .right-section {
            flex: 1;
            width: 100%;
            padding: 30px 20px;
        }
    }
</style>



</head>
<body>
<div class="container">

<div class="left-section"></div>
<div class="right-section">
<div class="form-container">
    
<div class="avatar-circle">
<i class="fa-solid fa-user"></i></div>

<form id="senddata" style="width: 100%;">
<div class="input-group">
<i class="fa-regular fa-user"></i>
<input type="text" placeholder="الاسم الأول" required name="name">
 </div>
<div class="input-group">
<i class="fa-regular fa-user"></i>
<input type="text" placeholder="اسم العائلة" required name="lastname">
</div>
<div class="input-group">
<i class="fa-regular fa-envelope"></i>
<input type="email" placeholder="البريد الإلكتروني" required name="email">
</div>
  <div class="input-group">
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="كلمة المرور" required name="password">
</div>
<div class="input-group">
<i class="fa-regular fa-id-card"></i>
<input type="number" placeholder="الرقم الجامعي" required name="id">
</div>
 <button type="submit" class="btn-submit">إنشاء حساب</button>
</form>            
<div class="login-link-container">
 هل تملك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
</div>
 </div>
</div>
</div>




<script>
     
 document.getElementById('senddata').addEventListener('submit', function (e) {
    e.preventDefault();

    const formdata = new FormData(e.target);
    const userData = {};
    formdata.forEach((value, key) => userData[key] = value);
    sessionStorage.setItem('signup_data', JSON.stringify(userData));
    window.location.href = '/camera';
});
</script>

</body>

</html>
